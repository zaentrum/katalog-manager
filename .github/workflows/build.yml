name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The organisation's shared neutrality check.
  neutrality:
    permissions:
      contents: read
    uses: zaentrum/.github/.github/workflows/neutrality.yml@v1

  build:
    runs-on: ubuntu-latest
    # The tests that read and write a catalog run against this Postgres; each
    # makes a schema of its own (internal/store/storetest). Without
    # KATALOG_TEST_DATABASE_URL they are skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KATALOG_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # The differential holds the gate to the record logic (python3, the
      # runner's, is enough), and the end-to-end test runs the schemas'
      # validator on a library a retire wrote in, which needs jsonschema and
      # referencing (internal/library/testdata/contract).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install "jsonschema[format-nongpl]>=4.23" referencing
      - run: go build ./...
      - run: go vet ./...
      # Each package's tests get 20 minutes, not go test's default 10: the
      # differential (internal/captions) takes about 6 minutes on this runner
      # and the library's tests about 4, and their full input sets stay.
      - run: go test -timeout 20m ./...

  # The differential once more where the compiler fuses a multiply and an add
  # into one multiply-add, which rounds once where the record logic rounds
  # twice. Go 1.24 fuses on arm64; on amd64 it doesn't, not even built for
  # x86-64-v3 (GOAMD64=v3 fuses from Go 1.25 on). The first test fails unless
  # this build fuses a bare a*b + c.
  fused:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the second differential runs the schemas' validator
      - run: python3 -m pip install "jsonschema[format-nongpl]>=4.23" referencing
      # -v: the log shows the proof and both differentials' counts.
      - run: go test -v -timeout 20m -count=1 -run '^(TestTheBuildFusesAMultiplyAndAnAdd|TestTheGateHoldsWhatTheRecordLogicHolds)$' ./internal/captions/
        env:
          KATALOG_TEST_FUSED: "1"
      - run: go test -v -timeout 20m -count=1 -run '^TestTheRecordCheckTakesNoSourceRecordTheValidatorRefuses$' ./internal/library/
      # the compliance check's arithmetic, which an admin's retire list
      # reads: each product rounded first here too (it proves the build fuses)
      - run: go test -v -count=1 -run '^TestTheChecksArithmeticRoundsEachProductFirst$' ./internal/compliance/
        env:
          KATALOG_TEST_FUSED: "1"
