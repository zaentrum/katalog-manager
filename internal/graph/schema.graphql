schema {
  query: Query
  mutation: Mutation
}

scalar Time

# ---------------------------------------------------------------------------
# Core read graph (replaces the OData KatalogService projections). The
# discriminated single-table model is one Item type; movies/series/episodes/
# albums are filtered queries (faithful to the katalogservice_* views).
# ---------------------------------------------------------------------------

type Item {
  id: ID!
  type: String!
  title: String!
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # true after a manual metadata edit: the enricher then leaves title / year /
  # description / tagline untouched (unlock to let enrichment refresh them).
  metadataLocked: Boolean!
  createdAt: Time
  modifiedAt: Time

  # computed (katalogservice_* view formulas)
  posterUrl: String
  backdropUrl: String
  runtimeMin: Float
  yearText: String
  isPackaged: Boolean!
  hasIntro: Boolean!
  hasCredits: Boolean!
  hasRecap: Boolean!

  # relations / facets
  parent: Item
  children: [Item!]!
  externalIds: [ItemExternalId!]!
  artwork: [ItemArtwork!]!
  assets: [PlaybackAsset!]!
  subtitles: [SubtitleAsset!]!
  segments: [MediaSegment!]!
  chapters: [ItemChapter!]!
  trailerLinks: [ItemTrailerLink!]!
  diagnostics: ItemDiagnostics
  processingSteps: [ItemProcessingStep!]!
  overallStatus: ItemOverallStatus
  genres: [Genre!]!
  # the title's credits, by role, then order, then name (see ItemPerson)
  people: [ItemPerson!]!
  tags: [String!]!
  # the title's age rating (see AgeRating); an episode is rated as its series
  ageRating: AgeRating
  # the audio and subtitle tracks of its source, with the language each
  # plays as (see Track): audio first, each kind by ordinal. None until a
  # package of the title has reported them (backfillSourceTracks reads the
  # packages on disk), and on a catalog older than migration 037.
  tracks: [Track!]!
  # its extras (see Extra), a movie's or a series' (an episode has none), as
  # a viewer sees them listed: by sortOrder (none last), then as they were
  # taken in. removed: the removed ones too. None on a catalog older than
  # migration 039.
  extras(removed: Boolean): [Extra!]!
  # what the library holds of it (see ItemLibrary); null on a catalog older
  # than migration 040.
  library: ItemLibrary
  # One file of several episodes (a double-length finale, named S05E15-E16)
  # belongs to the first of them, its holder: its source, versions, package,
  # pipeline run and retire are the holder's. coveredBy is the episode whose
  # file covers this one, whose version it plays (it has no file of its own,
  # and its steps of a file do not apply); null when no other's file covers
  # it, and on a catalog older than migration 045.
  coveredBy: Item
  # the other episodes this episode's file covers, in episode order; none for
  # a file of one episode
  covers: [Item!]!
}

# What the library holds of a title: with library.layout=v2 its record on
# storage, the packages it was packaged into (versions), the originals it was
# given (sources) and the facts its folder records after its records were
# written (events).
type ItemLibrary {
  # when its item.json was written: from then on its type and its parent
  # are kept; null while it is not recorded
  recorded: Time
  # whether its originals are kept whatever library.originals says
  # (holdOriginal)
  hold: Boolean!
  # its folder in the library, by the path rules; null for an item that has
  # none (a season, a track)
  dir: String
  # its package runs, the newest first
  versions: [LibraryVersion!]!
  # its originals, the oldest first
  sources: [LibrarySource!]!
  # the events its folder records, in their order; none while its folder is
  # not on storage
  events: [LibraryEvent!]!
}

# A package run of a title: building while the pipeline works on it, taken
# while its folder holds the original it was taken in from and no package
# (the title plays from that original until a package is added), complete
# once its package is recorded (the one that plays), superseded by a newer
# one, removed after its grace once its folder holds no original.
type LibraryVersion {
  id: ID!
  state: String!
  packageId: ID
  dir: String
  sourceIds: [ID!]!
  completedAt: Time
  # when its package was last verified, and how far: chain (its records) or
  # full (every file's hash)
  verifiedAt: Time
  verifiedLevel: String
  supersededBy: ID
  supersededAt: Time
  # when its removal began
  removedAt: Time
  createdAt: Time!
}

# An original a title was given: present while it is there (arrivalPath:
# where it arrived, or, from its first version on, versions/<versionId>/ of
# its title's folder), retiring while the retire job deletes it, deleted
# after packaging (its event retireEventId, and what its package does not
# carry of it, lost), or removed (no original of the title after all).
type LibrarySource {
  id: ID!
  # its name: the one the library gives it (original.<ext>) once its record
  # is written, the one it arrived with before
  filename: String!
  state: String!
  # where its original lies: where it arrived until it is in its version's
  # folder, there after; null once it is deleted
  arrivalPath: String
  # where it arrived, relative to the arrivals' root, until its record is
  # written: the catalog keeps no name a file arrived under after
  libraryPath: String
  sizeBytes: Float!
  qh1: String
  # when its record (sources/<id>/) was written
  recordedAt: Time
  retireEventId: ID
  deletedAt: Time
  deletedBy: String
  lost: [String!]!
  # why its retirement did not go through
  error: String
}

# A fact the title's folder records (events/): an original deleted, a
# package superseded, a version or an extra removed.
type LibraryEvent {
  id: ID!
  kind: String!
  at: Time
  by: String
  versionId: ID
  sourceId: ID
  packageId: ID
  extraId: ID
  supersededBy: ID
  reason: String
  # what an original's deletion accepted to lose; null for another kind
  accepted: [String!]
}

# An extra of a movie or a series: bonus material, a trailer or a teaser
# that is a file of its own, a featurette, a making-of, a deleted scene. It
# is no item: it is packaged on its own, from its file, into
# packages/extras/<aa>/<id>/ of the package store (transcode, then package,
# with the transcoder's extras ladder; no analyzer, no trickplay), and a
# viewer is served it beside its title. The id is the extraId.
type Extra {
  id: ID!
  itemId: ID!
  # featurette, behind-the-scenes, making-of, deleted-scene, interview,
  # trailer, teaser, gag-reel, short or other
  kind: String!
  # as it was taken in; label is what a viewer is shown instead
  title: String!
  label: String
  # the language spoken in it (BCP 47, or an ISO 639-2 code); null: unknown
  language: String
  # a series' extra may name the season it belongs to
  seasonNumber: Int
  # the file it is packaged from, its size and its quick hash (sha256 of its
  # first and last 64 KiB and its size), which tell the file after a move
  sourcePath: String
  sourceSize: Float
  sourceQh1: String
  # its folder in the library, when it is recorded there
  recordPath: String
  # how it was taken in: api (addExtra, POST /api/extras), scanner (the
  # scanner's convention, extras.scan) or library
  registeredBy: String!
  # its place in its title's list (null: after those with one), and whether
  # a viewer is shown it
  sortOrder: Int
  hidden: Boolean!
  # where its packaging stands: pending (waiting to be sent), queued (sent
  # to the transcoder), transcoding, transcoded (waiting for the packager),
  # packaging, ready, failed (no attempt left: packageExtra tries again) or
  # missing (the scanner found its file gone)
  state: String!
  # the error of its last failed run, credentials redacted
  error: String
  # the runs of its packaging started, and its failed runs in a row
  attempts: Int!
  failures: Int!
  # when it is sent again by itself; for a removed one, when its package is
  # deleted
  nextRetryAt: Time
  # when its trigger was last sent, while no worker has reported since, and
  # its worker's last word
  dispatchedAt: Time
  heartbeatAt: Time
  # its package: its folder, when it was recorded, how long it plays, its
  # top rendition's codec and size, the highest bandwidth its master
  # playlist names, and its size
  packagePath: String
  packagedAt: Time
  durationMs: Float
  videoCodec: String
  width: Int
  height: Int
  peakBandwidthBps: Float
  packageSizeBytes: Float
  # whether a viewer is served it: packaged, not removed, not hidden, and its
  # file not missing; a package made again plays the old one meanwhile
  playable: Boolean!
  # its removal (removeExtra): when, by whom and why; a removed extra stays,
  # and its package is deleted a day later
  removedAt: Time
  removedBy: String
  removalReason: String
  createdAt: Time!
  createdBy: String
  modifiedAt: Time!
  modifiedBy: String
}

# A track of a title's source: one of its audio or subtitle streams, as the
# packager last read the source, with the language an admin set for it. kind
# and ordinal name it as the packager's worker record does: kind is audio or
# subtitle, ordinal its place among the source's streams of its kind in
# ffprobe's order, 0 first (audio 0 is the first audio stream), counting a
# stream the packager left out too. A package carries every audio stream of
# its source, but an encode leaves out a subtitle stream it cannot copy
# (mov_text): a subtitle its package reports then counts as the package's,
# one lower than the source's for each such stream before it. Languages are
# ISO 639-2 codes, three lowercase letters, in the B ("ger") or the T form
# ("deu"); zxx is no linguistic content (a film without dialogue, "No
# dialogue"), und undetermined ("Unknown").
type Track {
  kind: String!
  ordinal: Int!
  # the language the source tags it with, as a package reported it; null when
  # none did, or when the package that first reported the track labelled it
  # with the admin's language, which hides the source's tag
  sourceLanguage: String
  # the language an admin set for it (setTrackLanguage); null: none
  languageOverride: String
  # the language it plays as: languageOverride, else sourceLanguage, else und
  effectiveLanguage: String!
  # its title tag ("Commentary")
  title: String
  # a subtitle's format as packaged (webvtt, pgs, vobsub, dvb), and whether
  # the source marks it forced
  format: String
  forced: Boolean!
  # whether a package reported it: false for a track only an admin's
  # language names, one set before a package reported the source's tracks
  reported: Boolean!
}

# A title's age rating. A kid's account is capped at an age (the max_rating
# claim of its access token) and is served only the titles rated at most that
# age, and unrated ones only when the setting ratings.unrated_for_capped says
# show. The rating comes from the certifications TMDB gives the title in the
# countries the setting ratings.countries names (CH,DE,US by default): the
# first of them that rates it wins, and of its certifications the strictest.
# An admin's minAgeOverride wins over it. Everything is null on a catalog
# older than migration 036, which rates nothing.
type AgeRating {
  # the certification as TMDB gives it ("12", "PG-13", "TV-MA") and its
  # country (ISO 3166-1 alpha-2, "DE"); null when no country of the list
  # rates the title, and for an episode, which is rated as its series
  certification: String
  country: String
  # the minimum age, in years, the certification means
  minAge: Int
  # an admin's rating of the title, in years (setMinAgeOverride); it wins
  # over minAge, and a series' over its episodes'
  minAgeOverride: Int
  # the age a capped viewer must be to be served the title: its override,
  # else its series' override, else its series' minAge (for an episode),
  # else its minAge; null: unrated
  effectiveMinAge: Int
  # when TMDB's certifications of the title were last read; null: never
  fetchedAt: Time
}

type PlaybackAsset {
  id: ID!
  itemId: ID!
  path: String!
  codec: String
  resolution: String
  bitrateKbps: Int
  sizeBytes: Float
  hash: String
  isPrimary: Boolean
  kind: String
  audioCodec: String
  audioLanguage: String
  audioChannels: Int
  audioBitrateKbps: Int
  audioTrackCount: Int
  subtitleTrackCount: Int
  durationMs: Float
  sizeMB: Float
}

type SubtitleAsset {
  id: ID!
  itemId: ID!
  path: String!
  format: String
  lang: String
  label: String
  isDefault: Boolean
  # whether the subtitle is forced, as its package says (migration 038); a
  # subtitle file beside the source is not
  isForced: Boolean!
}

type MediaSegment {
  id: ID!
  itemId: ID!
  kind: String!
  startMs: Float!
  endMs: Float!
  source: String!
  confidence: Float
  label: String
}

type ItemChapter {
  id: ID!
  itemId: ID!
  startMs: Float!
  endMs: Float!
  title: String
  ordinal: Int
}

# A step of an item's processing, as its worker last reported it. A step
# that fails is retried by the service (see retryStep and
# ProcessingOverview.retry): its trigger event is sent again after a backoff,
# a bounded number of times. A catalog without migration 033 keeps no
# failures, last error or retry (0 and null).
type ItemProcessingStep {
  id: ID!
  itemId: ID!
  step: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  # the runs the step has started: one more each time it turns in progress
  # from any other status, and one for its worker's first report of it (none
  # while it is only enqueued, pending); its worker saying it is in progress
  # again (a heartbeat), a run's end and a failure reported again count
  # nothing, and a retry or a reset keeps the count until the next run
  attempts: Int
  error: String
  details: String
  statusCriticality: Int
  # its failed runs in a row: 0 unless it failed since it last succeeded (or
  # was skipped, not applicable or retried by an admin); a run its timeout
  # cut short counts
  failures: Int!
  # the error of its last failed run, credentials redacted; kept while it is
  # retried and after
  lastError: String
  # when the service retries it by itself; null unless it failed with an
  # attempt left
  nextRetryAt: Time
  # when the service last sent its trigger event again, while no worker has
  # reported on it since
  dispatchedAt: Time
  # when it was last written: for a step in progress, its worker's last word
  updatedAt: Time
}

type ItemOverallStatus {
  itemId: ID!
  overallStatus: String
  doneCount: Int
  pendingCount: Int
  failedCount: Int
  inProgressCount: Int
  notApplicableCount: Int
  totalSteps: Int
  lastStepFinishedAt: Time
}

type Genre {
  id: ID!
  name: String!
}

# Someone a title credits. Everything but id and name is what TMDB says about
# them (or what someone set by hand); a catalog older than migration 030 has
# only id and name. Dates are YYYY-MM-DD.
type Person {
  id: ID!
  name: String!
  sortName: String
  alsoKnownAs: [String!]!
  birthDate: String
  deathDate: String
  birthPlace: String
  # one text per language (its primary subtag, e.g. en), by language
  biography: [LocalizedText!]!
  tmdbPersonId: String
  imdbId: String
  knownForDepartment: String
  # true: automation leaves every field alone; lockedFields: these fields
  metadataLocked: Boolean!
  lockedFields: [String!]!
  # where each field that is set came from (tmdb, manual, ...), by field
  fieldOrigins: [FieldOrigin!]!
  # when TMDB was last read for the person
  tmdbFetchedAt: Time
  # the last day TMDB's change list named them
  tmdbChangedAt: String
  createdAt: Time
  # when their data last changed
  modifiedAt: Time
  # every title that credits them, in each role, newest title first (see
  # PersonCredit)
  credits: [PersonCredit!]!
}

type LocalizedText {
  language: String!
  text: String!
}

type FieldOrigin {
  field: String!
  origin: String!
}

# A credit: someone a title credits, in a role, once per person and role. A
# role is a lowercase word: actor, creator, director, writer, producer,
# composer, cinematographer, editor, or another. A title lists its credits by
# role in that order (any other role after them, by role), then by order
# (unknown last), then by the person's name. job, character, order and
# episodeCount are what TMDB says of the credit, null when unknown (always on
# a catalog older than migration 032).
type ItemPerson {
  id: ID!
  role: String!
  # the person's jobs in the role, as TMDB names them, joined with ", "
  # ("Writer, Co-Writer"); "Creator" for a series' creator; null for an actor
  job: String
  # whom an actor plays; for a series every character, the most episodes
  # first, joined with " / "
  character: String
  # the credit's place in its role, 0 first: a film actor's billing order,
  # otherwise the rank (a series' by the episodes each is credited in)
  order: Int
  # the episodes of a series the person is credited in, in the role
  episodeCount: Int
  person: Person!
}

# A credit seen from the person (ItemPerson seen from the title): the title
# that credits them, in a role, with what TMDB says of the credit. A person's
# credits come newest title first: by year (a title without one in its
# parent's, an episode in its series'), unknown last; the titles of a year by
# name, a title under its parent's name after the parent (an episode under its
# series', by season and episode); and a title's credits by role as the title
# lists them. The title and its parent come with the credits, in the one query
# that reads them; anything else of the title is read as for any item.
type PersonCredit {
  id: ID!
  role: String!
  job: String
  character: String
  order: Int
  episodeCount: Int
  item: Item!
}

type ItemArtwork {
  id: ID!
  itemId: ID!
  kind: String!
  url: String!
}

type ItemExternalId {
  id: ID!
  itemId: ID!
  source: String!
  externalId: String!
}

type ItemTrailerLink {
  id: ID!
  itemId: ID!
  source: String!
  site: String
  externalId: String
  url: String!
  title: String
  durationSec: Int
  publishedAt: Time
  # a local copy of the trailer, if the catalog holds one: when it was
  # stored and where; null for a trailer the catalog only links to
  downloadedAt: Time
  localPath: String
}

type ItemDiagnostics {
  id: ID!
  itemId: ID!
  generatedAt: Time
  sourcePath: String
  sourceSize: Float
  sourceMtime: Time
  ffprobeData: String
  folderListing: String
  notes: String
}

# What the pipeline holds, step by step, and the steps that failed.
type ProcessingOverview {
  # every step, in the order the pipeline runs them, with how many items are
  # in each state of it
  steps: [ProcessingStepCounts!]!
  # the failed steps (of one step when asked), the latest failure first
  failed: [FailedStep!]!
  # how many steps failed (of one step when asked)
  failedTotal: Int!
  # how the service retries a step
  retry: RetryPolicy!
  # the titles queued to be encoded again (POST /api/library/reencode); null
  # on a catalog older than migration 043
  reencodeQueue: ReencodeQueue
}

# The re-encode queue: its titles by state — waiting (queued), sent to the
# transcoder, done once their package completed, failed when their
# transcode or package failed with no attempt left — of those waiting or
# sent the one queued first and the one queued last, and why the sweep
# sends none now (null when it may: library.reencode.rate a pass, no more
# than library.reencode.inflight sent at once, within
# library.reencode.window).
type ReencodeQueue {
  queued: Int!
  sent: Int!
  done: Int!
  failed: Int!
  oldest: QueuedTitle
  newest: QueuedTitle
  idle: String
}

type QueuedTitle {
  itemId: ID!
  state: String!
  enqueuedAt: Time!
}

type ProcessingStepCounts {
  step: String!
  pending: Int!
  inProgress: Int!
  done: Int!
  failed: Int!
  skipped: Int!
  notApplicable: Int!
  # of the failed, those the service retries by itself
  retrying: Int!
  # in progress with no word from the worker, or sent again and not started,
  # for longer than the step's timeout: what the service reaps next
  stalled: Int!
  # how long the step may be in progress without a word from its worker
  timeoutSeconds: Int!
}

# A failed step and its item (an episode with its series and its place in
# it).
type FailedStep {
  itemId: ID!
  itemTitle: String!
  itemType: String!
  seriesId: ID
  seriesTitle: String
  seasonNumber: Int
  episodeNumber: Int
  step: String!
  failures: Int!
  # the error of its last failed run, credentials redacted
  lastError: String
  failedAt: Time
  # when the service retries it by itself; null when it does not (no attempt
  # left, or failed before the service kept its retries)
  nextRetryAt: Time
}

# How the service retries a step. A failed step is retried by itself after a
# backoff (backoffSeconds after its first failure, doubled with every
# failure after, at most backoffMaxSeconds) until it has run maxAttempts
# times in a row; a step in progress without a word from its worker for
# longer than its timeout is taken for a failed run.
type RetryPolicy {
  # the service sends due retries and reaps silent steps by itself
  automatic: Boolean!
  # a step can be retried at all: the service has an event bus and migration
  # 033; reason says why not
  available: Boolean!
  reason: String
  maxAttempts: Int!
  backoffSeconds: Int!
  backoffMaxSeconds: Int!
  # how often the service looks for due retries and silent steps
  intervalSeconds: Int!
}

# A scan of the library. status is running, done or failed. A scan the
# service lost is failed, and errorMessage says how: one a restart cut short
# ("interrupted: ..."), failed when the service starts again, and one whose
# scanner has said nothing for longer than the scan's timeout ("timed out:
# ..."), failed by the reaper. A scan that ends after all says so itself.
type ScanJob {
  id: ID!
  source: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  errorMessage: String
  filesSeen: Int
  itemsInserted: Int
  itemsUpdated: Int
  # what the scan passed over and left alone (see ScanNote), the first 1000
  # (the log says every one); none while it runs, and on a catalog older than
  # migration 045
  report: [ScanNote!]!
}

# One entry of a scan's report. kind is unsupported, a file the scan takes in
# as nothing (a disc image, its reason "disc image: convert it to a single
# file"; itemId the title whose file it was already, whose steps that read it
# fail with that reason), or not-linked, an episode a file's name covers that
# the scan left alone (itemId it: it has a file of its own, which wins, or
# another file covers it already). path is the file.
type ScanNote {
  kind: String!
  path: String!
  itemId: ID
  reason: String!
}

type ActivityEvent {
  id: ID!
  itemId: ID!
  itemTitle: String!
  itemType: String!
  step: String!
  status: String!
  # the runs the step has started (as ItemProcessingStep.attempts)
  attempts: Int
  error: String
  startedAt: Time
  finishedAt: Time
  updatedAt: Time
}

# A setting. A secret one (isSecret: a credential, such as an API key) is
# write-only: its value is never returned, isSet says whether it has one, and
# setSecretSetting and clearSecretSetting are the only ways to change it.
type Setting {
  id: ID!
  key: String!
  # the value; null for a secret
  valueText: String
  valueType: String!
  description: String
  # a credential: the keys the service reads as API keys (tmdb.api_key,
  # omdb.api_key, fanart.api_key, fanart.client_key) and any key that names
  # one (a secret, a token, a password, a credential, an API key or a key)
  isSecret: Boolean!
  # whether it holds a value that is not blank
  isSet: Boolean!
  # when it was last written
  updatedAt: Time
  # what setSecretSetting found when it checked the value it set with the
  # service the secret is for; null in every other answer, and for a key
  # nothing checks
  check: SecretCheck
}

# What setSecretSetting found when it checked a secret's value with the
# service it is for, before storing it. The TMDB key (tmdb.api_key) is checked
# with TMDB's authentication endpoint, for a few seconds at most: a token TMDB
# refuses (401) is not stored, nor is one with a control character in it (a
# line break), which no token holds, and setSecretSetting answers an error
# saying so (code SECRET_REFUSED); one TMDB takes is valid; one TMDB could not
# be asked about (no answer in time, or an answer that is neither yes nor no)
# is stored all the same, unchecked.
type SecretCheck {
  # valid or unchecked
  status: String!
  # what the check found, to show the admin; it never holds the value
  message: String!
}

type EnrichmentStatusCode {
  code: String!
  name: String
}

# An item the catalog deleted, or a person (type "person") it deleted because
# no title credits them any more, from the deletion log: one entry per id, its
# latest deletion. If the catalog holds an item or person with this id again,
# it was re-created after the deletion, and the one that exists wins.
type DeletedItem {
  id: ID!
  # the item's type (movie, series, episode, ...), or person
  type: String!
  # the title it had when it was deleted; a person's name
  title: String!
  deletedAt: Time!
  # the principal's subject, or the service that deleted (katalog-manager/scanner)
  deletedBy: String!
  reason: String
}

# One of TMDB's change lists (person, movie, tv), as the daily refresh keeps
# it: the day its next run reads from, and what its last run did. The counts
# are of that run: ids the list named, those the catalog holds, and of them
# the ones refreshed, skipped (a locked record, an id TMDB no longer knows)
# and failed. lastRunError says why the cursor did not move, or what else is
# worth knowing.
type ReferenceSync {
  kind: String!
  # YYYY-MM-DD
  cursor: String!
  lastRunAt: Time
  lastRunChanges: Int
  lastRunMatched: Int
  lastRunRefreshed: Int
  lastRunSkipped: Int
  lastRunFailed: Int
  lastRunError: String
}

# ---------------------------------------------------------------------------
# Action result types
# ---------------------------------------------------------------------------

type SearchItem {
  id: ID!
  type: String!
  title: String!
  year: Int
  rating: Float
  score: Float
}

type SearchResult {
  # the page: at most limit items from offset, the best match first
  items: [SearchItem!]!
  # how many items match in all, counted with the same filters (not the
  # page's length)
  total: Int!
  limit: Int!
  offset: Int!
}

# How much the catalog holds, each counted in full: its movies, its series,
# the episodes of its series, and its people (everyone a title credits: the
# catalog deletes a person no title credits any more).
type CatalogStats {
  movies: Int!
  series: Int!
  episodes: Int!
  people: Int!
}

type EnrichStatus {
  tmdbEnabled: Boolean!
}

type EnrichResult {
  itemId: ID!
  status: String!
  message: String
}

type EnrichPendingResult {
  queued: Int!
  type: String
}

type BackfillResult {
  artworkData: Int!
  artwork: Int!
}

# What a backfillSourceProbes run did: the source assets it looked at (those
# missing any of the four probe values), those it filled anything of, by
# value, and those nothing in the catalog says more of yet.
type SourceProbeBackfillResult {
  assets: Int!
  filled: Int!
  codecs: Int!
  resolutions: Int!
  durations: Int!
  bitrates: Int!
  unknown: Int!
}

# What a backfillSourceTracks run did: the packaged titles whose package's
# manifest it read, those whose tracks it recorded with the tracks of each
# kind, and those it could not (a manifest missing, or none), each named in
# errors with why (the first 20).
type SourceTrackBackfillResult {
  titles: Int!
  recorded: Int!
  audioTracks: Int!
  subtitleTracks: Int!
  failed: Int!
  errors: [String!]!
}

# What a backfillRatings run did.
type RatingsBackfillResult {
  # titles whose certifications were read from TMDB: those a country of the
  # list rates, and those none rates (unrated)
  titlesRead: Int!
  titlesRated: Int!
  titlesUnrated: Int!
  # titles whose certifications could not be read or stored: they keep the
  # rating they had, and a later run tries again
  titlesFailed: Int!
  # the countries asked, in order (ratings.countries)
  countries: [String!]!
  startedAt: Time!
  finishedAt: Time!
}

# What a refreshPeople run did.
type PeopleRefreshResult {
  # titles whose TMDB credits were read again, those whose credits could not
  # be read or stored, and those that keep their credits (locked)
  titlesRead: Int!
  titlesFailed: Int!
  titlesLocked: Int!
  # people without a TMDB id who got theirs from a credit
  peopleMatched: Int!
  # credited people the catalog did not hold yet
  peopleCreated: Int!
  # credits titles gained from TMDB, and credits TMDB no longer lists (or in a
  # role no longer among KATALOG_CREDIT_ROLES), gone
  creditsAdded: Int!
  creditsDropped: Int!
  # credits kept whose job, character, order or episodeCount TMDB changed:
  # changed in place
  creditsUpdated: Int!
  # credits once matched to a namesake by name, now on the person credited
  creditsRelinked: Int!
  # people no title credits any more: deleted, and in the deletion log
  peopleDeleted: Int!
  # people whose details and profile were read and stored
  peopleFetched: Int!
  # people left alone because their record is locked
  peopleLocked: Int!
  # TMDB ids TMDB does not know (any more)
  peopleNotFound: Int!
  # people whose details could not be read; a later run tries again
  peopleFailed: Int!
  # people who still have no TMDB id: no credit TMDB lists names them
  peopleWithoutTmdbId: Int!
  startedAt: Time!
  finishedAt: Time!
}

type RetryResult {
  reset: Int!
  type: String
}

# What a retryStep call did. retried says whether the step's trigger event
# was sent again; message says what happened, or why not.
type RetryStepResult {
  itemId: ID!
  step: String!
  retried: Boolean!
  # the step's status after the call; null when the item has no such step
  status: String
  message: String!
}

# What a retryFailed call did: the steps retried, the items their events
# went to, and the steps whose event could not be sent (left failed).
type RetryFailedResult {
  retried: Int!
  items: Int!
  notSent: Int!
  step: String
  message: String!
}

# What a reencodeItem call did: the titles it looked at (the movie or the
# episode, or the episodes of the series that have a file), those it encodes
# again, those it left alone, and what happened. message says it, and why a
# title was left alone.
type ReencodeResult {
  itemId: ID!
  titles: Int!
  # of the titles, those encoded again: their transcode and package wait for
  # their workers, and the transcoder's event went
  reencoded: Int!
  # those left alone: a transcode or package of them is running, or waiting
  # for its worker, within the step's timeout
  busy: Int!
  # those whose event could not be sent: their transcode is put back, failed,
  # and sent again a backoff later when the service retries by itself
  notSent: Int!
  message: String!
}

# What a replaceSource call did: the title whose file it replaced, the file
# it had and the one it has now, whether the old file was deleted, the
# subtitle files named after the old one, and what encoding the title again
# did. message says it all, and why an old file asked to go was kept.
type ReplaceSourceResult {
  itemId: ID!
  # the file the title had, and the one it has now; the same when path was
  # its file already
  oldPath: String!
  path: String!
  # false: path was the title's file already, and nothing changed (nothing
  # deleted, nothing sent)
  replaced: Boolean!
  # whether the old file was deleted (deleteOldFile): only one under the media
  # root and outside the package store, that no title's file or extra is any
  # more, and that the new file does not lead to
  oldFileDeleted: Boolean!
  # the subtitle files beside the old file named after it (Film.srt,
  # Film.en.srt beside Film.mp4), which stay the title's subtitles as they
  # are. Beside a new file of the same name (Film.mkv) they pair with it as
  # they did; otherwise the next scan pairs those named after the new one,
  # and the packager takes them only from the new file's folder or below it.
  # 0 when nothing changed.
  oldSidecars: Int!
  # what encoding the title again from its new file did, as reencodeItem
  # answers; one that could not run (no event bus, no migration 033) says why
  # in its message. null when reencode was false, or nothing changed.
  reencode: ReencodeResult
  message: String!
}

# What an addExtra call did: the extra the file is, and whether it was taken
# in now (false: it was this item's extra already, which is the answer).
type AddExtraResult {
  created: Boolean!
  extra: Extra!
}

# What a packageExtra or packageExtras call did: the extras looked at, as
# they are after it (those removed not among them); those packaged again,
# waiting to be sent or sent; those left alone (in their packaging within
# its timeout, or whose file is missing); those whose trigger could not be
# sent, pending, sent again a backoff later; and what happened, why an extra
# was left alone.
type ExtraPackagingResult {
  extras: [Extra!]!
  queued: Int!
  busy: Int!
  notSent: Int!
  message: String!
}

type DeleteItemResult {
  deleted: Boolean!
  itemsRemoved: Int!
  filesRemoved: Int!
  packagesRemoved: Int!
  errors: [String!]!
  # the episodes the file of an item removed covered besides it (see
  # Item.covers), which stay items of their own, unlinked, with no file now
  unlinked: [ID!]!
}

type PackageResult {
  status: String
  alreadyActive: Boolean
  message: String
  episodesEnqueued: Int
  episodesTotal: Int
}

type ValidateFinding {
  code: String!
  message: String!
}

type ValidateResult {
  code: String!
  message: String!
  sourcePath: String
  packagePath: String
  findings: [ValidateFinding!]!
}

# ---------------------------------------------------------------------------
# Queries
# ---------------------------------------------------------------------------

type Query {
  item(id: ID!): Item
  items(type: String, genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  movies(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  series(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  episodes(seriesId: ID, seasonId: ID, limit: Int, offset: Int): [Item!]!
  albums(limit: Int, offset: Int): [Item!]!

  searchItems(q: String, type: String, genre: String, year: Int, limit: Int, offset: Int): SearchResult!
  # How many movies, series, episodes and people the catalog holds. The
  # lists are paged; this counts.
  catalogStats: CatalogStats!

  scanJob(id: ID!): ScanJob
  scanJobs(limit: Int): [ScanJob!]!

  # Pipeline activity feed: processing-step transitions across all items,
  # newest first (drives the Activity monitor, technical + friendly views).
  activity(limit: Int): [ActivityEvent!]!

  settings: [Setting!]!
  genres: [Genre!]!
  people: [Person!]!
  person(id: ID!): Person
  enrichStatus: EnrichStatus!
  enrichmentStatusCodes: [EnrichmentStatusCode!]!

  # The deletion log, newest first: items deleted at or after since (all when
  # omitted), at most limit (default 100, max 500). Read-only.
  deletedItems(since: Time, limit: Int): [DeletedItem!]!

  # The daily refresh from TMDB's change lists, one entry per list that has
  # run, by kind. Read-only.
  referenceSync: [ReferenceSync!]!

  # What the pipeline holds, step by step, and the failed steps (of one step
  # when given), the latest failure first: at most limit (default 50, max
  # 200), from offset.
  processingOverview(step: String, limit: Int, offset: Int): ProcessingOverview!
  # How the service retries a step, as the overview says it, without its
  # counts.
  retryPolicy: RetryPolicy!
}

# ---------------------------------------------------------------------------
# Mutations
# ---------------------------------------------------------------------------

input ItemInput {
  type: String
  title: String
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # set true on a manual edit (protects it from enrichment); false to unlock.
  metadataLocked: Boolean
}

type Mutation {
  # the library: hold the title's originals (hold: true), which the retire
  # job then leaves whatever library.originals says, or let them go; a
  # series' hold is its episodes' too. Answers what the library holds of it.
  holdOriginal(id: ID!, hold: Boolean!): ItemLibrary!
  # operator actions
  triggerScan(source: String): ScanJob!
  enrichOne(id: ID!): EnrichResult!
  # Manual match for items the automatic search can't resolve: re-search with a
  # corrected title and/or pin an exact TMDB id.
  identify(id: ID!, title: String, tmdbId: Int): EnrichResult!
  enrichPending(limit: Int, type: String): EnrichPendingResult!
  # Backfill people from TMDB: read the TMDB credits of titles again, so each
  # title credits exactly whom TMDB lists, in the roles KATALOG_CREDIT_ROLES
  # names (a person known only by name is matched by it once; a credit TMDB no
  # longer lists goes, one TMDB says more of changes in place, and a person no
  # title credits any more is deleted, in the deletion log), then read the
  # people's details and profiles. all: every title and every person with a
  # TMDB id; otherwise only the titles crediting someone without one, and the
  # people never read. Locks are honoured: a locked title keeps its credits.
  # The run finishes even when the caller stops waiting (its counts are
  # logged); one runs at a time.
  refreshPeople(all: Boolean): PeopleRefreshResult!
  # Rates titles from TMDB's certifications, as enrichment does (AgeRating):
  # reads the release dates of the movies and the content ratings of the
  # series that have a TMDB id. all: every one of them; otherwise only those
  # TMDB was never read for (ageRating.fetchedAt null), so running it again
  # picks up what a failure left. Episodes are rated as their series. The run
  # finishes even when the caller stops waiting (its counts are logged); one
  # runs at a time.
  backfillRatings(all: Boolean): RatingsBackfillResult!
  # Rates a title by hand: minAge, in years (0 to 21), wins over the rating
  # TMDB's certification gives it, and a series' over its episodes' unless an
  # episode has its own; null clears it. null when there is no such item.
  setMinAgeOverride(id: ID!, minAge: Int): Item
  # Sets the language of a track of a title's source (see Track): kind audio
  # or subtitle, ordinal the track's place among the source's streams of its
  # kind (0 first), language an ISO 639-2 code of three lowercase letters
  # (zxx: no dialogue, und: unknown); null clears it, and the track plays as
  # its source tags it again. It wins over the source's tag, and the
  # packager labels the track with it when it next packages the title
  # (reencodeItem packages a packaged title again). A title without a source
  # file has no tracks; once a package has reported the source's audio
  # tracks, an audio ordinal it did not report is refused (a package carries
  # every audio stream of its source; an encode may leave out a subtitle
  # stream it cannot copy, so a subtitle's ordinal is not checked). null when
  # there is no such item.
  setTrackLanguage(itemId: ID!, kind: String!, ordinal: Int!, language: String): Item
  backfillEpisodeBackdrops: BackfillResult!
  # Fills what a title's source asset lacks of its probe (its video codec,
  # resolution, duration and bit rate) from what the catalog has recorded:
  # the item's diagnostics, its transcode step's details (the transcoder's
  # probe of the source), its packaged asset's duration; a bit rate is the
  # size over the duration. A value a source has stays; running it again
  # changes nothing.
  backfillSourceProbes: SourceProbeBackfillResult!
  # Gives every title's source asset whose original is recorded and there
  # the size its source records, in place of another or none (a scan's of
  # the file before it was all there, or of another file once at its path),
  # and answers how many it gave one. A source not recorded yet, or whose
  # original was retired, is left alone; running it again changes nothing.
  backfillSourceSizes: Int!
  # Records the tracks of every packaged title's source (see Track) from its
  # package's manifest on disk, as packaging-complete records them from the
  # manifest it is sent: for the packages written before the catalog kept
  # them. Running it again records what the manifests say again. Refused on
  # a catalog without migration 037.
  backfillSourceTracks: SourceTrackBackfillResult!
  retryNotFound(type: String): RetryResult!
  # Retries a step of an item now: sends the event that triggers its worker
  # again. It retries a failed step (with or without attempts left), and one
  # in progress with no word from its worker, or waiting for one to start
  # it, for longer than its timeout; the step's failures in a row start
  # afresh. A step in progress or waiting within its timeout is left alone (a
  # retry would run it twice), and one done, not applicable or skipped is
  # terminal; the result says so.
  retryStep(itemId: ID!, step: String!): RetryStepResult!
  # Retries every failed step (of one step when given) as retryStep does.
  # The run finishes even when the caller stops waiting; one runs at a time.
  retryFailed(step: String): RetryFailedResult!
  # Encodes a title again with the pipeline's current settings (the
  # transcoder's ladder and encoder, then the packager's): a movie or an
  # episode with a file, or every episode of a series that has one. The
  # title's transcode and package wait for their workers afresh (their
  # failures in a row and retries cleared, their attempts kept), and the
  # transcoder is sent the event it consumes, not as a retry; the packager
  # follows. A title whose transcode or package is running, or waiting for
  # its worker, within the step's timeout is left alone (encoding it again
  # would run it twice). The current package plays while the title is
  # encoded; the packager then replaces it in place, and until the new one
  # is complete the title plays by on-demand transcoding. Refused without
  # an event bus or migration 033; the run finishes even when the caller
  # stops waiting.
  reencodeItem(id: ID!): ReencodeResult!
  # delete the re-encode queue's titles in states: by default those queued,
  # done and failed (a title sent is being encoded, and its end is still
  # noted). Answers how many it deleted.
  clearReencodeQueue(states: [String!]): Int!
  # Gives a title another file, its source, and keeps the title: a movie or an
  # episode with a file, named one way, by itemId or by itemPath (the path of
  # the file replaced, which a demo's reset keeps where it changes ids). path
  # is the new file: an absolute path of an existing video file under the
  # media root, never under the package store, that a scan takes for a
  # title's file (no hidden file, no extra by the scanner's convention), and
  # no other title's file or extra already. The title keeps its id and what
  # hangs off it: its metadata, artwork, credits, genres, tags, extras,
  # segments and chapters, the languages an admin set for its tracks (each
  # names a track by its kind and its place among the source's streams, and
  # applies to the new file's track at that place), its package, which plays
  # until the new one is in place, and everyone's progress and ratings, kept by
  # its id. What described the old file goes: its size, hash and probe, the
  # tracks a package reported of it, its diagnostics; the new file earns them
  # again. A path that is the title's file already changes nothing.
  # deleteOldFile: true deletes the old file once the title has the new one,
  # when it is under the media root, outside the package store, and no
  # title's file or extra is it any more; one kept under the media root is
  # taken in as a title of its own by the next scan, unless it is moved out or
  # deleted. reencode (true when omitted) encodes the title again from the new
  # file, as reencodeItem does: a title whose transcode or package is running
  # is left alone (busy), and that run is the old file's. A refusal is an
  # error whose extensions.code is NOT_FOUND (a title there is not),
  # SOURCE_CONFLICT (the file is another title's or an extra's, named in
  # itemId and extraId) or SOURCE_REFUSED.
  replaceSource(itemId: ID, itemPath: String, path: String!, deleteOldFile: Boolean, reencode: Boolean): ReplaceSourceResult!
  packageItem(id: ID!): PackageResult!
  validateItem(id: ID!): ValidateResult!

  # item + facet CRUD (operator edits)
  createItem(input: ItemInput!): Item!
  updateItem(id: ID!, input: ItemInput!): Item!
  # Remove an item from the catalog (a series cascades to its episodes). File
  # cleanup is explicit, and nothing leaves the disk unless asked:
  # deleteFiles: true removes the SOURCE MEDIA (irreversible; left in place, a
  # rescan re-imports the item); deletePackages: true removes the packaged HLS
  # artifacts (regenerable). Either omitted is false. Every item removed is
  # recorded in the deletion log with the caller and the optional reason.
  deleteItem(id: ID!, deleteFiles: Boolean, deletePackages: Boolean, reason: String): DeleteItemResult!
  setItemGenres(id: ID!, genres: [String!]!): Item!
  setItemTags(id: ID!, tags: [String!]!): Item!

  # settings (key read-only after create). createSetting and updateSetting
  # refuse a secret setting (Setting.isSecret): its value is set with
  # setSecretSetting and cleared with clearSecretSetting.
  createSetting(key: String!, valueText: String!, valueType: String, description: String): Setting!
  updateSetting(id: ID!, valueText: String, valueType: String, description: String): Setting!
  deleteSetting(id: ID!): Boolean!
  # Sets a secret setting to value (not blank), creating it when there is
  # none. Write-only: the result says it is set, never what it is. The TMDB
  # key is checked with TMDB first, and one TMDB refuses is not stored (see
  # SecretCheck; the result's check says what the check found).
  setSecretSetting(key: String!, value: String!): Setting!
  # Clears a secret setting, so the service falls back to its environment
  # default; false when there was none.
  clearSecretSetting(key: String!): Boolean!

  # extras (see Extra)
  # Takes a file in as an extra of a movie or a series (an episode has none,
  # its series has), and has it packaged: it waits to be sent, and its
  # trigger (catalog.extra.queued) goes now when the service has an event
  # bus. A seasonNumber is a series' season it has episodes of. The file is
  # stored with its size and quick hash. Idempotent on the file: the same
  # file again for the same title answers its extra (created false); for
  # another title it is refused, with the code EXTRA_CONFLICT and the extra
  # in the way. A title there is not is refused with the code NOT_FOUND,
  # anything else with EXTRA_REFUSED; on a catalog without migration 039
  # nothing is taken in.
  # The title is named one way: by itemId, by itemPath (the path of its
  # file, its primary asset), or by tmdbId and itemType (movie or series).
  # path is the extra's file: an absolute path of an existing video file
  # under the media root, LIBRARY_ROOT or EXTRAS_ROOT, never under the
  # package store. kind is one of Extra.kind's; title is the kind's name
  # when omitted ("Trailer"); language is BCP 47 or an ISO 639-2 code.
  addExtra(itemId: ID, itemPath: String, tmdbId: Int, itemType: String, path: String!, kind: String!,
    title: String, language: String, seasonNumber: Int): AddExtraResult!
  # Removes an extra: it stays, removed (with the caller and the reason),
  # plays no more, its file may be taken in again, and its package is
  # deleted a day later. Removing a removed extra changes nothing. null when
  # there is no such extra. An extra recorded in the library is refused: it
  # is removed by an extra-removed event of its record.
  removeExtra(id: ID!, reason: String): Extra
  # Packages an extra again with the pipeline's current settings (the
  # transcoder's extras ladder, then the packager's): it waits to be sent
  # afresh, its failures in a row cleared, and its trigger goes when the
  # service has an event bus; the package it has plays until the new one is
  # in place. One in its packaging within its timeout (waiting for a worker,
  # or one running) is left alone, and so is one whose file is missing until
  # the file is back. reencodeItem leaves a title's extras alone.
  packageExtra(id: ID!): ExtraPackagingResult!
  # Packages every extra of a title again, as packageExtra does.
  packageExtras(itemId: ID!): ExtraPackagingResult!
}

# ---------------------------------------------------------------------------
# The library's compliance: every movie and episode held against the rules
# the transcoder and the packager report they run with (README "Library
# compliance"). A rule whose worker never reported is not checked, and the
# report says so in notEvaluated; nothing assumes a worker's defaults. The
# report reads what the check last found, which a pass in the background
# keeps up: at startup, nightly, when the rules change, and for a title once
# its package completes or its pipeline ends.
# ---------------------------------------------------------------------------

enum ComplianceRule {
  # an original present, no package, and no transcode or package waiting or
  # running
  NOT_PACKAGED
  # no package, and the transcode or the package failed or was skipped, or
  # the file is a disc image, which the transcoder doesn't encode
  PACKAGING_FAILED
  # the package's video above the bit rate the transcoder allows for its kind
  # and bucket
  OVER_BITRATE_CAP
  # a movie whose original is larger than the file size the transcoder
  # allows, its video copied as it is
  OVER_SIZE_CAP
  # the packager makes a surround track, and the package lacks the surround
  # its source had
  NO_SURROUND
  # the source has image subtitles of a form the packager carries, and the
  # package carries none in their language
  IMAGE_SUBTITLES_MISSING
  # the package's video is not HEVC, which the transcoder's rules make it
  VIDEO_NOT_HEVC
}

enum ComplianceKind {
  MOVIE
  EPISODE
}

# The orders of the report's rows: by the size of their package (then of
# their original), of their original (then of their package), by what
# processing them again saves (their package's size less their estimate),
# by their video's bit rate, and by their title (an episode by its series',
# its season and its number).
enum ComplianceSort {
  PACKAGE_SIZE
  ORIGINAL_SIZE
  SAVING
  VIDEO_BITRATE
  TITLE
}

# One rule a worker reported, a row of the rules panel: its key in the report
# ("caps.movie2160Mbps"; of a row that says several, the first it gives), what
# it is ("Video bit rate, 2160p movies"), its value in words ("at most
# 14 Mbit/s"), and the configuration as reported where the value says it in
# words ("source:hevc"; null where the value is it).
type RuleSetting {
  key: String!
  label: String!
  value: String!
  detail: String
}

# What a worker last reported of the rules it runs with: its version (its
# image's commit or release), when (RFC 3339), and each rule.
type WorkerRules {
  worker: String!
  version: String
  reportedAt: String!
  rules: [RuleSetting!]!
}

# The rules of the transcoder and of the packager; null for a worker that
# never reported.
type PipelineRules {
  transcoder: WorkerRules
  packager: WorkerRules
}

# A rule a title breaks: the reason, in a sentence ("The video runs at
# 73 Mbit/s, above the 14 Mbit/s the transcoder allows for a 2160p movie."),
# what was measured and the limit the worker allows (null where a rule has
# none, or the row's columns show it), and what a tool said of it, an exit
# code or a codec id ("ffmpeg exited 1", "avc1.640028"), never in the text
# (null for nothing).
type ComplianceFinding {
  rule: ComplianceRule!
  text: String!
  measured: String
  limit: String
  detail: String
}

# A title that breaks a rule. originalBytes is the size of its original,
# packageBytes of its package; estimatedBytes an estimate of its package once
# it is processed again, not a bound (what today's transcoder and packager
# make of its original, as its records tell: the video of each rung of the
# ladder, copied or at its maxrate, the audio, and what the package holds
# beside its renditions), null when the records don't tell. queue is
# where it stands in the re-encode queue (queued, sent, done or failed; null
# when it was never queued), queueReason why it waits or failed there (a
# title queued and not yet sent "It is waiting in the queue." when nothing
# else holds it), and queueDetail that reason's technical part (what a
# worker said, an event).
# reworkBlocked says why processing it again can't help, as the clause the
# console says after a colon ("its file is a disc image, which the
# transcoder doesn’t encode", "the original has no video", "Dolby Vision
# profile 7 needs a tone-mapping encode"), null when it can: its original
# deleted after packaging or being deleted, no file, a disc image, or what
# its original's record or its failed step tells the transcoder would refuse
# again; such a title has no estimate, and is no queueable one.
# evaluatedAt is when the check found it so (RFC 3339).
type ComplianceRow {
  itemId: ID!
  title: String!
  year: Int
  kind: ComplianceKind!
  seriesId: ID
  seriesTitle: String
  season: Int
  episode: Int
  findings: [ComplianceFinding!]!
  originalBytes: Float
  packageBytes: Float
  estimatedBytes: Float
  queue: String
  queueReason: String
  queueDetail: String
  reworkBlocked: String
  evaluatedAt: String!
  # What the report's columns show of it, as the check measured it: its
  # video's size ("3840×2160") and codec ("HEVC", "H.264"), the package's,
  # else the original's; its video's average bit rate (bit/s), as
  # OVER_BITRATE_CAP measures it, the package's, else the original's, and
  # whether it was estimated of a size and a duration; the transcoder's caps
  # that hold for it, the bit rate of its kind and bucket (bit/s) and a
  # movie's file size (bytes), null where none was reported or it allows any;
  # its duration (s); its package's and its original's audio, from their
  # records ("5.1 E‑AC‑3 + 2.0 AAC", "7.1 TrueHD"); and what processing it
  # again does.
  resolution: String
  videoCodec: String
  videoBitrate: Float
  videoBitrateEstimated: Boolean!
  bitrateCap: Float
  sizeCap: Float
  durationSeconds: Float
  packageAudio: String
  originalAudio: String
  outcome: ComplianceOutcome
}

# What processing a title again does to it, of the rules it breaks: its video
# encoded again (over a cap of the transcoder's, or not HEVC), its package
# made again of its video as it is (a track missing), its first package (it
# was never packaged), or nothing (processing it again can't help:
# reworkBlocked).
enum ComplianceOutcome {
  REENCODE
  REPACKAGE
  FIRST_PACKAGE
  BLOCKED
}

# Of the titles of the report's kind and search, whatever its rules, those
# that break a rule: how many, and of the same titles, those with an
# estimate, the size of their packages now and the estimate of them once
# processed again (null when none has one); withoutEstimate counts those
# left out of both. evaluated is whether the rule is checked under the rules
# as the workers reported them: false where no title is held against it, as
# notEvaluated says (a worker that never reported; a report that gives no
# limit the rule is checked by, or switches every one of them off; a
# transcoder whose ladder makes no video HEVC, as libx265 with its default
# ladder; the older layout), so that its titles, 0, don't read as none
# breaking it.
type ComplianceSummary {
  rule: ComplianceRule!
  titles: Int!
  packageBytes: Float!
  estimatedBytes: Float
  withoutEstimate: Int!
  evaluated: Boolean!
}

# The titles a report's whole filter (kind, rules, search) matches: how
# many, and the size of their originals; and of the same titles, those with
# an estimate, the size of their packages now and the estimate of them once
# processed again (null when none has one), so that the two compare the
# same titles; withoutEstimate counts those left out of both. fingerprint
# names the titles, whatever their order: the same while they are the same
# titles, another once one comes or goes (a hash of their ids); the
# queueable's is what queueReworkMatching takes back.
type ComplianceTotals {
  titles: Int!
  originalBytes: Float!
  packageBytes: Float!
  estimatedBytes: Float
  withoutEstimate: Int!
  fingerprint: String!
}

# The re-encode queue, all its titles, by state: queued, processing (sent),
# processed (done) and failed.
type ComplianceQueueCounts {
  queued: Int!
  processing: Int!
  processed: Int!
  failed: Int!
}

# A page of the titles that break a rule, in the order asked (the largest
# package first, then the largest original, by default). total counts the
# titles the filter matches, and matching sums them up; queueable sums up
# those of them a request to process them again queues, what
# queueReworkMatching queues: none queued already (queued or sent), none
# that processing again can't help (reworkBlocked). nextCursor, passed as
# after, reads the next page (null on the last). notEvaluated says each rule that is not checked, and
# why. evaluatedAt is the oldest check of the titles of the report's kind
# and search (null when none was ever checked); evaluating, whether a pass
# runs; pending, how many titles of the kind wait for the next pass (never
# checked, or checked before a change of the rules or of the title). queue
# counts the re-encode queue.
type ComplianceReport {
  rules: PipelineRules!
  notEvaluated: [String!]!
  evaluatedAt: String
  evaluating: Boolean!
  pending: Int!
  total: Int!
  # The titles of the report's kind and search the check has checked,
  # whether they break a rule or not: "281 titles checked".
  checkedTitles: Int
  matching: ComplianceTotals!
  queueable: ComplianceTotals!
  queue: ComplianceQueueCounts!
  # How processing a title again goes now, from the settings as they are
  # set, for the console's confirm.
  processing: ComplianceProcessing!
  summary: [ComplianceSummary!]!
  rows: [ComplianceRow!]!
  nextCursor: String
}

# How processing a title again goes, from the settings as they are set:
# what becomes of a title's original once its new version is complete
# (originals, library.originals: keep, or delete-after-package, when it is
# deleted), how many titles the re-encode queue has encoded at once at most
# (inflight, library.reencode.inflight; null where it is not set), and when
# it sends them (window, library.reencode.window, which the queue reads in
# the service's local time: each end with that time's offset from UTC then,
# "23:00+01:00-07:00+01:00", "01:00Z-06:00Z" in UTC, of the window that holds
# now, else of the next one; null where it is not set, or is none, any time).
type ComplianceProcessing {
  originals: String!
  inflight: Int
  window: String
}

# A title a request to process titles again didn't queue: its id, its name
# as a list names it ("A Film (1991)", "A Show · S01E02 · Its Title"; a name
# the catalog doesn't hold is its id), and why, in the reader's words, as
# the clause a sentence says after a colon ("its file is a disc image, which
# the transcoder doesn’t encode").
type ComplianceSkip {
  itemId: ID!
  title: String!
  reason: String!
}

# What a request to process titles again did: those queued, those queued
# already (waiting or sent), those skipped (no file, the original deleted
# after packaging, a disc image, no movie, episode or series), each of them
# in skippedTitles with why, and what happened as the console says it: a
# toast of the titles queued, without a full stop ("12 titles queued to be
# processed again"; null when none was), a plain one of those already in the
# queue ("3 titles already in the queue"; null when none was), and a banner
# line of those not queued, with why when they share one ("2 titles weren’t
# queued: their originals were deleted after packaging."), or of nothing
# queued at all ("Nothing was queued: no title was selected."; null when
# there is nothing to say). message is the three in one text.
type ComplianceQueued {
  queued: Int!
  alreadyQueued: Int!
  skipped: Int!
  skippedTitles: [ComplianceSkip!]!
  queuedText: String
  alreadyText: String
  notQueuedText: String
  message: String!
}

extend type Query {
  # The rules the transcoder and the packager last reported.
  pipelineRules: PipelineRules!
  # A page of the movies and episodes that break a rule (any of rules, when
  # given), of kind, whose title or series' title holds search, sorted by
  # sort, descending or not (a null key last either way): at most first
  # (default 100, at most 500), after the cursor after, a nextCursor of the
  # same sort and direction.
  libraryCompliance(kind: ComplianceKind, rules: [ComplianceRule!], search: String, first: Int = 100, after: String,
    sort: ComplianceSort = PACKAGE_SIZE, descending: Boolean = true): ComplianceReport!
}

extend type Mutation {
  # Queues titles to be processed again under the rules the workers run
  # with now, through the re-encode queue, which sends them at its pace (a
  # series is its episodes). A title named that processing again can't help
  # is not queued, and skippedTitles says why: one the queue can't encode
  # (no file, a disc image, its original deleted after packaging) and one
  # the check found the transcoder can't (a row's reworkBlocked). Nothing
  # else queues a title the check found.
  queueRework(items: [ID!]!): ComplianceQueued!
  # Queues the titles the filter matches that break a rule and that a
  # request queues, the report's queueable: none queued already, none that
  # processing again can't help; as queueRework does. It counts those in
  # the queue already (alreadyQueued), as queueRework does, and names none
  # that processing again can't help, which the console never offers; it
  # says no title fits the filter only when none does. expected and
  # fingerprint are the report's queueable the console offered, its titles
  # and its fingerprint: when the titles that are queueable now are not
  # those, nothing is queued, and notQueuedText says so ("Nothing was
  # queued: the matching titles changed, from 40 to 42."; of as many others,
  # "Nothing was queued: the matching titles changed.").
  queueReworkMatching(kind: ComplianceKind, rules: [ComplianceRule!], search: String, expected: Int!,
    fingerprint: String!): ComplianceQueued!
  # Has the titles of kind (all when omitted) checked again, in the
  # background; true once the pass is set going.
  refreshCompliance(kind: ComplianceKind): Boolean!
}

# ---- an admin's list of originals to retire ----

# A run of retireOriginals. A dry run checks each title of the list an admin
# names and says whether it would retire its original; a run retires the
# originals of the titles a dry run found it would (fromRun, that dry run),
# each checked again once the run may act on it, through the retire job's own
# path (its event, the trash and its grace, the source's row, what the
# package lacks of it), one at a time, at most library.retire.rate a minute.
# library.originals stays as it is, and library.retire.list says what a list
# may do: off, dry-run (the default) or on. state is RUNNING until every
# title has its result (DONE), an admin stopped it or the setting does not
# let it go on (STOPPED), or it could not go on (FAILED); error says why of
# the last two. One runs at a time, in the background: it goes on when the
# admin goes away, and one a restart interrupted goes on where it stopped.
# requestedBy is the admin who asked (their subject). The counts are of its
# titles: pending those still to come; bytes the size of the originals it
# retired (of a dry run, would retire).
type RetireRun {
  id: ID!
  state: RetireRunState!
  dryRun: Boolean!
  fromRun: ID
  requestedBy: String!
  startedAt: Time!
  finishedAt: Time
  error: String
  total: Int!
  pending: Int!
  retired: Int!
  wouldRetire: Int!
  skipped: Int!
  failed: Int!
  bytes: Float!
  # its titles in the list's order: at most first (1 to 500) after the
  # place after (a title's position), of result alone when given
  items(first: Int = 100, after: Int = 0, result: RetireResult): [RetireItem!]!
}

enum RetireRunState {
  RUNNING
  DONE
  STOPPED
  FAILED
}

# What a run did with a title: retired its original, skipped it (a condition
# does not hold, reason says which), failed to retire it (the retire path
# refused, reason says why; nothing is deleted before its event is recorded,
# and a failure after says so: the retire job finishes it), or, in a dry run,
# would retire it.
enum RetireResult {
  RETIRED
  SKIPPED
  FAILED
  WOULD_RETIRE
}

# A title of a run's list: its place in it (from 1), its id, its name as a
# list names it ("A Film (1991)") when the run began, the original the run
# retires of it, its result (null while it waits), why, as the clause a
# sentence says after a colon ("its originals are held (holdOriginal)"; of a
# title a dry run would retire, what its package doesn't carry of the
# original and the files that go with it into the trash), the size of its
# original, and when it got its result. A title is retired only when: it is a
# movie or an episode whose file is its own (an episode another's file covers
# names its holder) and it is not held; it has a complete version, verified
# once at least, made of exactly one original, which is present; no step that
# reads the original waits, runs or is to be retried, and it is not in the
# re-encode queue; the compliance check found it within every rule under the
# rules both workers report now, of its current version, since the nightly
# check; its version's folder is there, and its package has the surround of
# its original; its original is a file of its own (no link) where the catalog
# says, under a root the retire path deletes under, of the size recorded, and
# the trash is on its filesystem (unless library.trash.grace is 0); its
# version's checksums are not pending, the source's record verifies, and no
# file beside the original would be lost with it; and no episode its file
# covers is held, at work or in the re-encode queue. A run checks a title
# once it may act on it, and the retire path asks again right before it
# records the event.
type RetireItem {
  position: Int!
  itemId: ID!
  title: String
  sourceId: ID
  result: RetireResult
  reason: String
  bytes: Float
  at: Time
}

extend type Query {
  # The run of retireOriginals begun last, running or not; null when none
  # ever ran.
  retireRun: RetireRun
}

extend type Mutation {
  # Runs a list in the background, and answers the run as it begins;
  # retireRun follows it. A dry run (the default) of the titles items names
  # (movies and episodes, by their ids, each once), or of the titles the dry
  # run fromRun found it would retire; with dryRun false, a run that retires
  # the originals of the titles the dry run fromRun found it would, each
  # checked again (titles named are a dry run alone, and library.retire.list
  # must be on). Refused with library.retire.list off (OFF), a run with it
  # dry-run (DRY_RUN_ONLY), a run of titles named (NAMED_TITLES), titles and
  # fromRun both (BOTH), no title (EMPTY), an id that is no title's (BAD_ID),
  # more than 10,000 (TOO_MANY), fromRun no dry run done with a title it
  # would retire (FROM_RUN), while a run runs (RUNNING), with library.layout
  # legacy (LEGACY), or without migration 052 (UNAVAILABLE).
  retireOriginals(items: [ID!], fromRun: ID, dryRun: Boolean = true): RetireRun!
  # Stops the run that runs once the title it is at has its result (STOPPED,
  # its titles still to come left as they are); null when none runs.
  stopRetireRun: RetireRun
}
