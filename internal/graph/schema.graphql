schema {
  query: Query
  mutation: Mutation
}

scalar Time

# ---------------------------------------------------------------------------
# Core read graph (replaces the OData KatalogService projections). The
# discriminated single-table model is one Item type; movies/series/episodes/
# albums are filtered queries (faithful to the katalogservice_* views).
# ---------------------------------------------------------------------------

type Item {
  id: ID!
  type: String!
  title: String!
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # true after a manual metadata edit: the enricher then leaves title / year /
  # description / tagline untouched (unlock to let enrichment refresh them).
  metadataLocked: Boolean!
  createdAt: Time
  modifiedAt: Time

  # computed (katalogservice_* view formulas)
  posterUrl: String
  backdropUrl: String
  runtimeMin: Float
  yearText: String
  isPackaged: Boolean!
  hasIntro: Boolean!
  hasCredits: Boolean!
  hasRecap: Boolean!

  # relations / facets
  parent: Item
  children: [Item!]!
  externalIds: [ItemExternalId!]!
  artwork: [ItemArtwork!]!
  assets: [PlaybackAsset!]!
  subtitles: [SubtitleAsset!]!
  segments: [MediaSegment!]!
  chapters: [ItemChapter!]!
  trailerLinks: [ItemTrailerLink!]!
  diagnostics: ItemDiagnostics
  processingSteps: [ItemProcessingStep!]!
  overallStatus: ItemOverallStatus
  genres: [Genre!]!
  # the title's credits, by role, then order, then name (see ItemPerson)
  people: [ItemPerson!]!
  tags: [String!]!
  # the title's age rating (see AgeRating); an episode is rated as its series
  ageRating: AgeRating
}

# A title's age rating. A kid's account is capped at an age (the max_rating
# claim of its access token) and is served only the titles rated at most that
# age, and unrated ones only when the setting ratings.unrated_for_capped says
# show. The rating comes from the certifications TMDB gives the title in the
# countries the setting ratings.countries names (CH,DE,US by default): the
# first of them that rates it wins, and of its certifications the strictest.
# An admin's minAgeOverride wins over it. Everything is null on a catalog
# older than migration 036, which rates nothing.
type AgeRating {
  # the certification as TMDB gives it ("12", "PG-13", "TV-MA") and its
  # country (ISO 3166-1 alpha-2, "DE"); null when no country of the list
  # rates the title, and for an episode, which is rated as its series
  certification: String
  country: String
  # the minimum age, in years, the certification means
  minAge: Int
  # an admin's rating of the title, in years (setMinAgeOverride); it wins
  # over minAge, and a series' over its episodes'
  minAgeOverride: Int
  # the age a capped viewer must be to be served the title: its override,
  # else its series' override, else its series' minAge (for an episode),
  # else its minAge; null: unrated
  effectiveMinAge: Int
  # when TMDB's certifications of the title were last read; null: never
  fetchedAt: Time
}

type PlaybackAsset {
  id: ID!
  itemId: ID!
  path: String!
  codec: String
  resolution: String
  bitrateKbps: Int
  sizeBytes: Float
  hash: String
  isPrimary: Boolean
  kind: String
  audioCodec: String
  audioLanguage: String
  audioChannels: Int
  audioBitrateKbps: Int
  audioTrackCount: Int
  subtitleTrackCount: Int
  durationMs: Float
  sizeMB: Float
}

type SubtitleAsset {
  id: ID!
  itemId: ID!
  path: String!
  format: String
  lang: String
  label: String
  isDefault: Boolean
}

type MediaSegment {
  id: ID!
  itemId: ID!
  kind: String!
  startMs: Float!
  endMs: Float!
  source: String!
  confidence: Float
  label: String
}

type ItemChapter {
  id: ID!
  itemId: ID!
  startMs: Float!
  endMs: Float!
  title: String
  ordinal: Int
}

# A step of an item's processing, as its worker last reported it. A step
# that fails is retried by the service (see retryStep and
# ProcessingOverview.retry): its trigger event is sent again after a backoff,
# a bounded number of times. A catalog without migration 033 keeps no
# failures, last error or retry (0 and null).
type ItemProcessingStep {
  id: ID!
  itemId: ID!
  step: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  # how often the step was written: every report of its worker counts
  attempts: Int
  error: String
  details: String
  statusCriticality: Int
  # its failed runs in a row: 0 unless it failed since it last succeeded (or
  # was skipped, not applicable or retried by an admin); a run its timeout
  # cut short counts
  failures: Int!
  # the error of its last failed run, credentials redacted; kept while it is
  # retried and after
  lastError: String
  # when the service retries it by itself; null unless it failed with an
  # attempt left
  nextRetryAt: Time
  # when the service last sent its trigger event again, while no worker has
  # reported on it since
  dispatchedAt: Time
  # when it was last written: for a step in progress, its worker's last word
  updatedAt: Time
}

type ItemOverallStatus {
  itemId: ID!
  overallStatus: String
  doneCount: Int
  pendingCount: Int
  failedCount: Int
  inProgressCount: Int
  notApplicableCount: Int
  totalSteps: Int
  lastStepFinishedAt: Time
}

type Genre {
  id: ID!
  name: String!
}

# Someone a title credits. Everything but id and name is what TMDB says about
# them (or what someone set by hand); a catalog older than migration 030 has
# only id and name. Dates are YYYY-MM-DD.
type Person {
  id: ID!
  name: String!
  sortName: String
  alsoKnownAs: [String!]!
  birthDate: String
  deathDate: String
  birthPlace: String
  # one text per language (its primary subtag, e.g. en), by language
  biography: [LocalizedText!]!
  tmdbPersonId: String
  imdbId: String
  knownForDepartment: String
  # true: automation leaves every field alone; lockedFields: these fields
  metadataLocked: Boolean!
  lockedFields: [String!]!
  # where each field that is set came from (tmdb, manual, ...), by field
  fieldOrigins: [FieldOrigin!]!
  # when TMDB was last read for the person
  tmdbFetchedAt: Time
  # the last day TMDB's change list named them
  tmdbChangedAt: String
  createdAt: Time
  # when their data last changed
  modifiedAt: Time
  # every title that credits them, in each role, newest title first (see
  # PersonCredit)
  credits: [PersonCredit!]!
}

type LocalizedText {
  language: String!
  text: String!
}

type FieldOrigin {
  field: String!
  origin: String!
}

# A credit: someone a title credits, in a role, once per person and role. A
# role is a lowercase word: actor, creator, director, writer, producer,
# composer, cinematographer, editor, or another. A title lists its credits by
# role in that order (any other role after them, by role), then by order
# (unknown last), then by the person's name. job, character, order and
# episodeCount are what TMDB says of the credit, null when unknown (always on
# a catalog older than migration 032).
type ItemPerson {
  id: ID!
  role: String!
  # the person's jobs in the role, as TMDB names them, joined with ", "
  # ("Writer, Co-Writer"); "Creator" for a series' creator; null for an actor
  job: String
  # whom an actor plays; for a series every character, the most episodes
  # first, joined with " / "
  character: String
  # the credit's place in its role, 0 first: a film actor's billing order,
  # otherwise the rank (a series' by the episodes each is credited in)
  order: Int
  # the episodes of a series the person is credited in, in the role
  episodeCount: Int
  person: Person!
}

# A credit seen from the person (ItemPerson seen from the title): the title
# that credits them, in a role, with what TMDB says of the credit. A person's
# credits come newest title first: by year (a title without one in its
# parent's, an episode in its series'), unknown last; the titles of a year by
# name, a title under its parent's name after the parent (an episode under its
# series', by season and episode); and a title's credits by role as the title
# lists them. The title and its parent come with the credits, in the one query
# that reads them; anything else of the title is read as for any item.
type PersonCredit {
  id: ID!
  role: String!
  job: String
  character: String
  order: Int
  episodeCount: Int
  item: Item!
}

type ItemArtwork {
  id: ID!
  itemId: ID!
  kind: String!
  url: String!
}

type ItemExternalId {
  id: ID!
  itemId: ID!
  source: String!
  externalId: String!
}

type ItemTrailerLink {
  id: ID!
  itemId: ID!
  source: String!
  site: String
  externalId: String
  url: String!
  title: String
  durationSec: Int
  publishedAt: Time
  # a local copy of the trailer, if the catalog holds one: when it was
  # stored and where; null for a trailer the catalog only links to
  downloadedAt: Time
  localPath: String
}

type ItemDiagnostics {
  id: ID!
  itemId: ID!
  generatedAt: Time
  sourcePath: String
  sourceSize: Float
  sourceMtime: Time
  ffprobeData: String
  folderListing: String
  notes: String
}

# What the pipeline holds, step by step, and the steps that failed.
type ProcessingOverview {
  # every step, in the order the pipeline runs them, with how many items are
  # in each state of it
  steps: [ProcessingStepCounts!]!
  # the failed steps (of one step when asked), the latest failure first
  failed: [FailedStep!]!
  # how many steps failed (of one step when asked)
  failedTotal: Int!
  # how the service retries a step
  retry: RetryPolicy!
}

type ProcessingStepCounts {
  step: String!
  pending: Int!
  inProgress: Int!
  done: Int!
  failed: Int!
  skipped: Int!
  notApplicable: Int!
  # of the failed, those the service retries by itself
  retrying: Int!
  # in progress with no word from the worker, or sent again and not started,
  # for longer than the step's timeout: what the service reaps next
  stalled: Int!
  # how long the step may be in progress without a word from its worker
  timeoutSeconds: Int!
}

# A failed step and its item (an episode with its series and its place in
# it).
type FailedStep {
  itemId: ID!
  itemTitle: String!
  itemType: String!
  seriesId: ID
  seriesTitle: String
  seasonNumber: Int
  episodeNumber: Int
  step: String!
  failures: Int!
  # the error of its last failed run, credentials redacted
  lastError: String
  failedAt: Time
  # when the service retries it by itself; null when it does not (no attempt
  # left, or failed before the service kept its retries)
  nextRetryAt: Time
}

# How the service retries a step. A failed step is retried by itself after a
# backoff (backoffSeconds after its first failure, doubled with every
# failure after, at most backoffMaxSeconds) until it has run maxAttempts
# times in a row; a step in progress without a word from its worker for
# longer than its timeout is taken for a failed run.
type RetryPolicy {
  # the service sends due retries and reaps silent steps by itself
  automatic: Boolean!
  # a step can be retried at all: the service has an event bus and migration
  # 033; reason says why not
  available: Boolean!
  reason: String
  maxAttempts: Int!
  backoffSeconds: Int!
  backoffMaxSeconds: Int!
  # how often the service looks for due retries and silent steps
  intervalSeconds: Int!
}

# A scan of the library. status is running, done or failed. A scan the
# service lost is failed, and errorMessage says how: one a restart cut short
# ("interrupted: ..."), failed when the service starts again, and one whose
# scanner has said nothing for longer than the scan's timeout ("timed out:
# ..."), failed by the reaper. A scan that ends after all says so itself.
type ScanJob {
  id: ID!
  source: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  errorMessage: String
  filesSeen: Int
  itemsInserted: Int
  itemsUpdated: Int
}

type ActivityEvent {
  id: ID!
  itemId: ID!
  itemTitle: String!
  itemType: String!
  step: String!
  status: String!
  attempts: Int
  error: String
  startedAt: Time
  finishedAt: Time
  updatedAt: Time
}

# A setting. A secret one (isSecret: a credential, such as an API key) is
# write-only: its value is never returned, isSet says whether it has one, and
# setSecretSetting and clearSecretSetting are the only ways to change it.
type Setting {
  id: ID!
  key: String!
  # the value; null for a secret
  valueText: String
  valueType: String!
  description: String
  # a credential: the keys the service reads as API keys (tmdb.api_key,
  # omdb.api_key, fanart.api_key, fanart.client_key) and any key that names
  # one (a secret, a token, a password, a credential, an API key or a key)
  isSecret: Boolean!
  # whether it holds a value that is not blank
  isSet: Boolean!
  # when it was last written
  updatedAt: Time
  # what setSecretSetting found when it checked the value it set with the
  # service the secret is for; null in every other answer, and for a key
  # nothing checks
  check: SecretCheck
}

# What setSecretSetting found when it checked a secret's value with the
# service it is for, before storing it. The TMDB key (tmdb.api_key) is checked
# with TMDB's authentication endpoint, for a few seconds at most: a token TMDB
# refuses (401) is not stored, nor is one with a control character in it (a
# line break), which no token holds, and setSecretSetting answers an error
# saying so (code SECRET_REFUSED); one TMDB takes is valid; one TMDB could not
# be asked about (no answer in time, or an answer that is neither yes nor no)
# is stored all the same, unchecked.
type SecretCheck {
  # valid or unchecked
  status: String!
  # what the check found, to show the admin; it never holds the value
  message: String!
}

type EnrichmentStatusCode {
  code: String!
  name: String
}

# An item the catalog deleted, or a person (type "person") it deleted because
# no title credits them any more, from the deletion log: one entry per id, its
# latest deletion. If the catalog holds an item or person with this id again,
# it was re-created after the deletion, and the one that exists wins.
type DeletedItem {
  id: ID!
  # the item's type (movie, series, episode, ...), or person
  type: String!
  # the title it had when it was deleted; a person's name
  title: String!
  deletedAt: Time!
  # the principal's subject, or the service that deleted (katalog-manager/scanner)
  deletedBy: String!
  reason: String
}

# One of TMDB's change lists (person, movie, tv), as the daily refresh keeps
# it: the day its next run reads from, and what its last run did. The counts
# are of that run: ids the list named, those the catalog holds, and of them
# the ones refreshed, skipped (a locked record, an id TMDB no longer knows)
# and failed. lastRunError says why the cursor did not move, or what else is
# worth knowing.
type ReferenceSync {
  kind: String!
  # YYYY-MM-DD
  cursor: String!
  lastRunAt: Time
  lastRunChanges: Int
  lastRunMatched: Int
  lastRunRefreshed: Int
  lastRunSkipped: Int
  lastRunFailed: Int
  lastRunError: String
}

# ---------------------------------------------------------------------------
# Action result types
# ---------------------------------------------------------------------------

type SearchItem {
  id: ID!
  type: String!
  title: String!
  year: Int
  rating: Float
  score: Float
}

type SearchResult {
  # the page: at most limit items from offset, the best match first
  items: [SearchItem!]!
  # how many items match in all, counted with the same filters (not the
  # page's length)
  total: Int!
  limit: Int!
  offset: Int!
}

# How much the catalog holds, each counted in full: its movies, its series,
# the episodes of its series, and its people (everyone a title credits: the
# catalog deletes a person no title credits any more).
type CatalogStats {
  movies: Int!
  series: Int!
  episodes: Int!
  people: Int!
}

type EnrichStatus {
  tmdbEnabled: Boolean!
}

type EnrichResult {
  itemId: ID!
  status: String!
  message: String
}

type EnrichPendingResult {
  queued: Int!
  type: String
}

type BackfillResult {
  artworkData: Int!
  artwork: Int!
}

# What a backfillSourceProbes run did: the source assets it looked at (those
# missing any of the four probe values), those it filled anything of, by
# value, and those nothing in the catalog says more of yet.
type SourceProbeBackfillResult {
  assets: Int!
  filled: Int!
  codecs: Int!
  resolutions: Int!
  durations: Int!
  bitrates: Int!
  unknown: Int!
}

# What a backfillRatings run did.
type RatingsBackfillResult {
  # titles whose certifications were read from TMDB: those a country of the
  # list rates, and those none rates (unrated)
  titlesRead: Int!
  titlesRated: Int!
  titlesUnrated: Int!
  # titles whose certifications could not be read or stored: they keep the
  # rating they had, and a later run tries again
  titlesFailed: Int!
  # the countries asked, in order (ratings.countries)
  countries: [String!]!
  startedAt: Time!
  finishedAt: Time!
}

# What a refreshPeople run did.
type PeopleRefreshResult {
  # titles whose TMDB credits were read again, those whose credits could not
  # be read or stored, and those that keep their credits (locked)
  titlesRead: Int!
  titlesFailed: Int!
  titlesLocked: Int!
  # people without a TMDB id who got theirs from a credit
  peopleMatched: Int!
  # credited people the catalog did not hold yet
  peopleCreated: Int!
  # credits titles gained from TMDB, and credits TMDB no longer lists (or in a
  # role no longer among KATALOG_CREDIT_ROLES), gone
  creditsAdded: Int!
  creditsDropped: Int!
  # credits kept whose job, character, order or episodeCount TMDB changed:
  # changed in place
  creditsUpdated: Int!
  # credits once matched to a namesake by name, now on the person credited
  creditsRelinked: Int!
  # people no title credits any more: deleted, and in the deletion log
  peopleDeleted: Int!
  # people whose details and profile were read and stored
  peopleFetched: Int!
  # people left alone because their record is locked
  peopleLocked: Int!
  # TMDB ids TMDB does not know (any more)
  peopleNotFound: Int!
  # people whose details could not be read; a later run tries again
  peopleFailed: Int!
  # people who still have no TMDB id: no credit TMDB lists names them
  peopleWithoutTmdbId: Int!
  startedAt: Time!
  finishedAt: Time!
}

type RetryResult {
  reset: Int!
  type: String
}

# What a retryStep call did. retried says whether the step's trigger event
# was sent again; message says what happened, or why not.
type RetryStepResult {
  itemId: ID!
  step: String!
  retried: Boolean!
  # the step's status after the call; null when the item has no such step
  status: String
  message: String!
}

# What a retryFailed call did: the steps retried, the items their events
# went to, and the steps whose event could not be sent (left failed).
type RetryFailedResult {
  retried: Int!
  items: Int!
  notSent: Int!
  step: String
  message: String!
}

type DeleteItemResult {
  deleted: Boolean!
  itemsRemoved: Int!
  filesRemoved: Int!
  packagesRemoved: Int!
  errors: [String!]!
}

type PackageResult {
  status: String
  alreadyActive: Boolean
  message: String
  episodesEnqueued: Int
  episodesTotal: Int
}

type ValidateFinding {
  code: String!
  message: String!
}

type ValidateResult {
  code: String!
  message: String!
  sourcePath: String
  packagePath: String
  findings: [ValidateFinding!]!
}

# ---------------------------------------------------------------------------
# Queries
# ---------------------------------------------------------------------------

type Query {
  item(id: ID!): Item
  items(type: String, genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  movies(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  series(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  episodes(seriesId: ID, seasonId: ID, limit: Int, offset: Int): [Item!]!
  albums(limit: Int, offset: Int): [Item!]!

  searchItems(q: String, type: String, genre: String, year: Int, limit: Int, offset: Int): SearchResult!
  # How many movies, series, episodes and people the catalog holds. The
  # lists are paged; this counts.
  catalogStats: CatalogStats!

  scanJob(id: ID!): ScanJob
  scanJobs(limit: Int): [ScanJob!]!

  # Pipeline activity feed: processing-step transitions across all items,
  # newest first (drives the Activity monitor, technical + friendly views).
  activity(limit: Int): [ActivityEvent!]!

  settings: [Setting!]!
  genres: [Genre!]!
  people: [Person!]!
  person(id: ID!): Person
  enrichStatus: EnrichStatus!
  enrichmentStatusCodes: [EnrichmentStatusCode!]!

  # The deletion log, newest first: items deleted at or after since (all when
  # omitted), at most limit (default 100, max 500). Read-only.
  deletedItems(since: Time, limit: Int): [DeletedItem!]!

  # The daily refresh from TMDB's change lists, one entry per list that has
  # run, by kind. Read-only.
  referenceSync: [ReferenceSync!]!

  # What the pipeline holds, step by step, and the failed steps (of one step
  # when given), the latest failure first: at most limit (default 50, max
  # 200), from offset.
  processingOverview(step: String, limit: Int, offset: Int): ProcessingOverview!
  # How the service retries a step, as the overview says it, without its
  # counts.
  retryPolicy: RetryPolicy!
}

# ---------------------------------------------------------------------------
# Mutations
# ---------------------------------------------------------------------------

input ItemInput {
  type: String
  title: String
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # set true on a manual edit (protects it from enrichment); false to unlock.
  metadataLocked: Boolean
}

type Mutation {
  # operator actions
  triggerScan(source: String): ScanJob!
  enrichOne(id: ID!): EnrichResult!
  # Manual match for items the automatic search can't resolve: re-search with a
  # corrected title and/or pin an exact TMDB id.
  identify(id: ID!, title: String, tmdbId: Int): EnrichResult!
  enrichPending(limit: Int, type: String): EnrichPendingResult!
  # Backfill people from TMDB: read the TMDB credits of titles again, so each
  # title credits exactly whom TMDB lists, in the roles KATALOG_CREDIT_ROLES
  # names (a person known only by name is matched by it once; a credit TMDB no
  # longer lists goes, one TMDB says more of changes in place, and a person no
  # title credits any more is deleted, in the deletion log), then read the
  # people's details and profiles. all: every title and every person with a
  # TMDB id; otherwise only the titles crediting someone without one, and the
  # people never read. Locks are honoured: a locked title keeps its credits.
  # The run finishes even when the caller stops waiting (its counts are
  # logged); one runs at a time.
  refreshPeople(all: Boolean): PeopleRefreshResult!
  # Rates titles from TMDB's certifications, as enrichment does (AgeRating):
  # reads the release dates of the movies and the content ratings of the
  # series that have a TMDB id. all: every one of them; otherwise only those
  # TMDB was never read for (ageRating.fetchedAt null), so running it again
  # picks up what a failure left. Episodes are rated as their series. The run
  # finishes even when the caller stops waiting (its counts are logged); one
  # runs at a time.
  backfillRatings(all: Boolean): RatingsBackfillResult!
  # Rates a title by hand: minAge, in years (0 to 21), wins over the rating
  # TMDB's certification gives it, and a series' over its episodes' unless an
  # episode has its own; null clears it. null when there is no such item.
  setMinAgeOverride(id: ID!, minAge: Int): Item
  backfillEpisodeBackdrops: BackfillResult!
  # Fills what a title's source asset lacks of its probe (its video codec,
  # resolution, duration and bit rate) from what the catalog has recorded:
  # the item's diagnostics, its transcode step's details (the transcoder's
  # probe of the source), its packaged asset's duration; a bit rate is the
  # size over the duration. A value a source has stays; running it again
  # changes nothing.
  backfillSourceProbes: SourceProbeBackfillResult!
  retryNotFound(type: String): RetryResult!
  # Retries a step of an item now: sends the event that triggers its worker
  # again. It retries a failed step (with or without attempts left), and one
  # in progress with no word from its worker, or waiting for one to start
  # it, for longer than its timeout; the step's failures in a row start
  # afresh. A step in progress or waiting within its timeout is left alone (a
  # retry would run it twice), and one done, not applicable or skipped is
  # terminal; the result says so.
  retryStep(itemId: ID!, step: String!): RetryStepResult!
  # Retries every failed step (of one step when given) as retryStep does.
  # The run finishes even when the caller stops waiting; one runs at a time.
  retryFailed(step: String): RetryFailedResult!
  packageItem(id: ID!): PackageResult!
  validateItem(id: ID!): ValidateResult!

  # item + facet CRUD (operator edits)
  createItem(input: ItemInput!): Item!
  updateItem(id: ID!, input: ItemInput!): Item!
  # Remove an item from the catalog (a series cascades to its episodes). File
  # cleanup is explicit, and nothing leaves the disk unless asked:
  # deleteFiles: true removes the SOURCE MEDIA (irreversible; left in place, a
  # rescan re-imports the item); deletePackages: true removes the packaged HLS
  # artifacts (regenerable). Either omitted is false. Every item removed is
  # recorded in the deletion log with the caller and the optional reason.
  deleteItem(id: ID!, deleteFiles: Boolean, deletePackages: Boolean, reason: String): DeleteItemResult!
  setItemGenres(id: ID!, genres: [String!]!): Item!
  setItemTags(id: ID!, tags: [String!]!): Item!

  # settings (key read-only after create). createSetting and updateSetting
  # refuse a secret setting (Setting.isSecret): its value is set with
  # setSecretSetting and cleared with clearSecretSetting.
  createSetting(key: String!, valueText: String!, valueType: String, description: String): Setting!
  updateSetting(id: ID!, valueText: String, valueType: String, description: String): Setting!
  deleteSetting(id: ID!): Boolean!
  # Sets a secret setting to value (not blank), creating it when there is
  # none. Write-only: the result says it is set, never what it is. The TMDB
  # key is checked with TMDB first, and one TMDB refuses is not stored (see
  # SecretCheck; the result's check says what the check found).
  setSecretSetting(key: String!, value: String!): Setting!
  # Clears a secret setting, so the service falls back to its environment
  # default; false when there was none.
  clearSecretSetting(key: String!): Boolean!
}
