schema {
  query: Query
  mutation: Mutation
}

scalar Time

# ---------------------------------------------------------------------------
# Core read graph (replaces the OData KatalogService projections). The
# discriminated single-table model is one Item type; movies/series/episodes/
# albums are filtered queries (faithful to the katalogservice_* views).
# ---------------------------------------------------------------------------

type Item {
  id: ID!
  type: String!
  title: String!
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # true after a manual metadata edit: the enricher then leaves title / year /
  # description / tagline untouched (unlock to let enrichment refresh them).
  metadataLocked: Boolean!
  createdAt: Time
  modifiedAt: Time

  # computed (katalogservice_* view formulas)
  posterUrl: String
  backdropUrl: String
  runtimeMin: Float
  yearText: String
  isPackaged: Boolean!
  hasIntro: Boolean!
  hasCredits: Boolean!
  hasRecap: Boolean!

  # relations / facets
  parent: Item
  children: [Item!]!
  externalIds: [ItemExternalId!]!
  artwork: [ItemArtwork!]!
  assets: [PlaybackAsset!]!
  subtitles: [SubtitleAsset!]!
  segments: [MediaSegment!]!
  chapters: [ItemChapter!]!
  trailerLinks: [ItemTrailerLink!]!
  diagnostics: ItemDiagnostics
  processingSteps: [ItemProcessingStep!]!
  overallStatus: ItemOverallStatus
  genres: [Genre!]!
  people: [ItemPerson!]!
  tags: [String!]!
}

type PlaybackAsset {
  id: ID!
  itemId: ID!
  path: String!
  codec: String
  resolution: String
  bitrateKbps: Int
  sizeBytes: Float
  hash: String
  isPrimary: Boolean
  kind: String
  audioCodec: String
  audioLanguage: String
  audioChannels: Int
  audioBitrateKbps: Int
  audioTrackCount: Int
  subtitleTrackCount: Int
  durationMs: Float
  sizeMB: Float
}

type SubtitleAsset {
  id: ID!
  itemId: ID!
  path: String!
  format: String
  lang: String
  label: String
  isDefault: Boolean
}

type MediaSegment {
  id: ID!
  itemId: ID!
  kind: String!
  startMs: Float!
  endMs: Float!
  source: String!
  confidence: Float
  label: String
}

type ItemChapter {
  id: ID!
  itemId: ID!
  startMs: Float!
  endMs: Float!
  title: String
  ordinal: Int
}

type ItemProcessingStep {
  id: ID!
  itemId: ID!
  step: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  attempts: Int
  error: String
  details: String
  statusCriticality: Int
}

type ItemOverallStatus {
  itemId: ID!
  overallStatus: String
  doneCount: Int
  pendingCount: Int
  failedCount: Int
  inProgressCount: Int
  notApplicableCount: Int
  totalSteps: Int
  lastStepFinishedAt: Time
}

type Genre {
  id: ID!
  name: String!
}

# Someone a title credits. Everything but id and name is what TMDB says about
# them (or what someone set by hand); a catalog older than migration 030 has
# only id and name. Dates are YYYY-MM-DD.
type Person {
  id: ID!
  name: String!
  sortName: String
  alsoKnownAs: [String!]!
  birthDate: String
  deathDate: String
  birthPlace: String
  # one text per language (its primary subtag, e.g. en), by language
  biography: [LocalizedText!]!
  tmdbPersonId: String
  imdbId: String
  knownForDepartment: String
  # true: automation leaves every field alone; lockedFields: these fields
  metadataLocked: Boolean!
  lockedFields: [String!]!
  # where each field that is set came from (tmdb, manual, ...), by field
  fieldOrigins: [FieldOrigin!]!
  # when TMDB was last read for the person
  tmdbFetchedAt: Time
  # the last day TMDB's change list named them
  tmdbChangedAt: String
  createdAt: Time
  # when their data last changed
  modifiedAt: Time
}

type LocalizedText {
  language: String!
  text: String!
}

type FieldOrigin {
  field: String!
  origin: String!
}

type ItemPerson {
  id: ID!
  role: String!
  person: Person!
}

type ItemArtwork {
  id: ID!
  itemId: ID!
  kind: String!
  url: String!
}

type ItemExternalId {
  id: ID!
  itemId: ID!
  source: String!
  externalId: String!
}

type ItemTrailerLink {
  id: ID!
  itemId: ID!
  source: String!
  site: String
  externalId: String
  url: String!
  title: String
  durationSec: Int
  publishedAt: Time
  downloadedAt: Time
  localPath: String
}

type ItemDiagnostics {
  id: ID!
  itemId: ID!
  generatedAt: Time
  sourcePath: String
  sourceSize: Float
  sourceMtime: Time
  ffprobeData: String
  folderListing: String
  notes: String
}

type ScanJob {
  id: ID!
  source: String!
  status: String!
  startedAt: Time
  finishedAt: Time
  errorMessage: String
  filesSeen: Int
  itemsInserted: Int
  itemsUpdated: Int
}

type ActivityEvent {
  id: ID!
  itemId: ID!
  itemTitle: String!
  itemType: String!
  step: String!
  status: String!
  attempts: Int
  error: String
  startedAt: Time
  finishedAt: Time
  updatedAt: Time
}

type DownloadJob {
  id: ID!
  adapter: String!
  clientJobId: String!
  title: String
  wantedItemId: String
  state: String!
  progressPct: Float
  downloadedBytes: Float
  sizeBytes: Float
  speedBps: Float
  etaSec: Int
  files: String
  errorMessage: String
  startedAt: Time
  completedAt: Time
  lastEventAt: Time
  stateCriticality: Int
}

type Setting {
  id: ID!
  key: String!
  valueText: String!
  valueType: String!
  description: String
}

type EnrichmentStatusCode {
  code: String!
  name: String
}

# An item the catalog deleted, from the deletion log: one entry per id, its
# latest deletion. If the catalog holds an item with this id again, it was
# re-created after the deletion, and the item that exists wins.
type DeletedItem {
  id: ID!
  type: String!
  # the title it had when it was deleted
  title: String!
  deletedAt: Time!
  # the principal's subject, or the service that deleted (katalog-manager/scanner)
  deletedBy: String!
  reason: String
}

# ---------------------------------------------------------------------------
# Action result types
# ---------------------------------------------------------------------------

type SearchItem {
  id: ID!
  type: String!
  title: String!
  year: Int
  rating: Float
  score: Float
}

type SearchResult {
  items: [SearchItem!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type EnrichStatus {
  tmdbEnabled: Boolean!
}

type EnrichResult {
  itemId: ID!
  status: String!
  message: String
}

type EnrichPendingResult {
  queued: Int!
  type: String
}

type BackfillResult {
  artworkData: Int!
  artwork: Int!
}

# What a refreshPeople run did.
type PeopleRefreshResult {
  # titles whose TMDB credits were read again, and those that could not be
  titlesRead: Int!
  titlesFailed: Int!
  # people without a TMDB id who got theirs from a credit
  peopleMatched: Int!
  # credited people the catalog did not hold yet
  peopleCreated: Int!
  # credits once matched to a namesake by name, now on the person credited
  creditsRelinked: Int!
  # people whose details and profile were read and stored
  peopleFetched: Int!
  # people left alone because their record is locked
  peopleLocked: Int!
  # TMDB ids TMDB does not know (any more)
  peopleNotFound: Int!
  # people whose details could not be read; a later run tries again
  peopleFailed: Int!
  # people who still have no TMDB id: no credit TMDB lists names them
  peopleWithoutTmdbId: Int!
  startedAt: Time!
  finishedAt: Time!
}

type RetryResult {
  reset: Int!
  type: String
}

type DeleteItemResult {
  deleted: Boolean!
  itemsRemoved: Int!
  filesRemoved: Int!
  packagesRemoved: Int!
  errors: [String!]!
}

type PackageResult {
  status: String
  alreadyActive: Boolean
  message: String
  episodesEnqueued: Int
  episodesTotal: Int
}

type ValidateFinding {
  code: String!
  message: String!
}

type ValidateResult {
  code: String!
  message: String!
  sourcePath: String
  packagePath: String
  findings: [ValidateFinding!]!
}

type FetchTrailersResult {
  itemId: ID!
  title: String
  enqueued: Int!
  packageId: String
  jobIds: [String!]!
  message: String
}

type DownloadCommandResult {
  ok: Boolean!
  adapter: String
  clientJobId: String
  message: String
}

# ---------------------------------------------------------------------------
# Queries
# ---------------------------------------------------------------------------

type Query {
  item(id: ID!): Item
  items(type: String, genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  movies(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  series(genre: String, year: Int, search: String, limit: Int, offset: Int): [Item!]!
  episodes(seriesId: ID, seasonId: ID, limit: Int, offset: Int): [Item!]!
  albums(limit: Int, offset: Int): [Item!]!

  searchItems(q: String, type: String, genre: String, year: Int, limit: Int, offset: Int): SearchResult!

  scanJob(id: ID!): ScanJob
  scanJobs(limit: Int): [ScanJob!]!

  # Pipeline activity feed: processing-step transitions across all items,
  # newest first (drives the Activity monitor, technical + friendly views).
  activity(limit: Int): [ActivityEvent!]!

  downloadJobs(limit: Int): [DownloadJob!]!
  downloadClients: String!

  settings: [Setting!]!
  genres: [Genre!]!
  people: [Person!]!
  person(id: ID!): Person
  enrichStatus: EnrichStatus!
  enrichmentStatusCodes: [EnrichmentStatusCode!]!

  # The deletion log, newest first: items deleted at or after since (all when
  # omitted), at most limit (default 100, max 500). Read-only.
  deletedItems(since: Time, limit: Int): [DeletedItem!]!
}

# ---------------------------------------------------------------------------
# Mutations
# ---------------------------------------------------------------------------

input ItemInput {
  type: String
  title: String
  sortTitle: String
  year: Int
  description: String
  rating: Float
  durationMs: Float
  parentId: ID
  seasonNumber: Int
  episodeNumber: Int
  tagline: String
  # set true on a manual edit (protects it from enrichment); false to unlock.
  metadataLocked: Boolean
}

type Mutation {
  # operator actions
  triggerScan(source: String): ScanJob!
  enrichOne(id: ID!): EnrichResult!
  # Manual match for items the automatic search can't resolve: re-search with a
  # corrected title and/or pin an exact TMDB id.
  identify(id: ID!, title: String, tmdbId: Int): EnrichResult!
  enrichPending(limit: Int, type: String): EnrichPendingResult!
  # Backfill people from TMDB: read the TMDB credits of titles again, so the
  # people they credit get their TMDB ids (a person known only by name is
  # matched by it once), then read those people's details and profiles. all:
  # every title and every person with a TMDB id; otherwise only the titles
  # crediting someone without one, and the people never read. Locks are
  # honoured. The run finishes even when the caller stops waiting (its counts
  # are logged); one runs at a time.
  refreshPeople(all: Boolean): PeopleRefreshResult!
  backfillEpisodeBackdrops: BackfillResult!
  retryNotFound(type: String): RetryResult!
  packageItem(id: ID!): PackageResult!
  validateItem(id: ID!): ValidateResult!
  fetchTrailers(id: ID!): FetchTrailersResult!

  # downloads (CQRS command side)
  addDownload(adapter: String!, source: String!, title: String, wantedItemId: String): DownloadCommandResult!
  cancelDownload(adapter: String!, clientJobId: String!): DownloadCommandResult!

  # item + facet CRUD (operator edits)
  createItem(input: ItemInput!): Item!
  updateItem(id: ID!, input: ItemInput!): Item!
  # Remove an item from the catalog (a series cascades to its episodes). File
  # cleanup is explicit: deleteFiles removes the SOURCE MEDIA from disk
  # (irreversible; left in place, a rescan re-imports the item);
  # deletePackages removes the packaged HLS artifacts (regenerable). Every item
  # removed is recorded in the deletion log with the caller and the optional
  # reason.
  deleteItem(id: ID!, deleteFiles: Boolean, deletePackages: Boolean, reason: String): DeleteItemResult!
  setItemGenres(id: ID!, genres: [String!]!): Item!
  setItemTags(id: ID!, tags: [String!]!): Item!

  # settings (key read-only after create)
  createSetting(key: String!, valueText: String!, valueType: String, description: String): Setting!
  updateSetting(id: ID!, valueText: String, valueType: String, description: String): Setting!
  deleteSetting(id: ID!): Boolean!
}
